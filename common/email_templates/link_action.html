{% extends "layout.html" %}
{% block action %}
                    <tr>
                      <td align="left" style="padding-bottom:28px;">
                        <table role="presentation" class="btn-table" cellpadding="0" cellspacing="0" border="0">
                          <tr>
                            <td class="btn" align="center" bgcolor="#171717" style="background-color:#171717;border-radius:8px;"><a class="btn-text" href="{{ link }}" style="display:inline-block;padding:14px 28px;color:#ffffff;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;line-height:1.2;text-decoration:none;">{{ button }}</a></td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                    <tr>
                      <td class="muted" style="color:#6e6e6e;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;padding-bottom:4px;">{{ link_label }}</td>
                    </tr>
                    <tr>
                      <td style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;line-height:1.5;word-break:break-all;"><a class="link" href="{{ link }}" style="color:#171717;text-decoration:underline;">{{ link }}</a></td>
                    </tr>
{% endblock %}
