# Linter and import sorter (dev only). Line length 100, as agreed.
line-length = 100
target-version = "py313"
extend-exclude = [".venv"]

[lint]
# E/W = pycodestyle, F = pyflakes (unused imports and names), I = import order.
select = ["E", "F", "W", "I"]

[lint.isort]
known-first-party = ["apps", "common", "config"]
